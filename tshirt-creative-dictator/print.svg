<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .ink{stroke:currentColor;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .t{fill:currentColor;font-family:Inter,'Helvetica Neue',Arial,sans-serif}
    .m{fill:currentColor;font-family:'DejaVu Sans Mono',Menlo,monospace}
  </style>
  <g color="#111">
    <!-- crown bent from a single paperclip -->
    <g transform="translate(110 40)">
      <path class="ink" d="M24 118 L24 34 L62 82 L90 22 L118 82 L156 34 L156 118 Z"/>
      <path class="ink" d="M39 104 L39 66 L62 96 L90 52 L118 96 L141 66 L141 104 L76 104"/>
    </g>
    <text class="t" x="200" y="222" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="1">CREATIVE</text>
    <text class="t" x="200" y="266" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="1">DICTATOR</text>
    <line x1="120" y1="290" x2="280" y2="290" stroke="currentColor" stroke-width="2"/>
    <text class="m" x="200" y="312" font-size="11" text-anchor="middle" letter-spacing="2">DEPT. OF FINAL DECISIONS</text>
  </g>
  <!-- tiny red approval stamp -->
  <g transform="translate(318 92) rotate(-12)">
    <rect x="-40" y="-13" width="80" height="26" rx="3" fill="none" stroke="#E0352B" stroke-width="2.5"/>
    <text x="0" y="5" font-family="'DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#E0352B" text-anchor="middle" letter-spacing="2">APPROVED</text>
  </g>
</svg>
